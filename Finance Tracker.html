<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sapujagat — Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
<style>
:root{
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --accent:#2A6FDB;
  --radius-scale:1;
  --r-sm:calc(9px*var(--radius-scale));
  --r-md:calc(16px*var(--radius-scale));
  --r-lg:calc(26px*var(--radius-scale));
  --r-pill:999px;
}
:root[data-theme="light"]{
  --bg:#F6F1E8; --bg-grad:#F2EADC;
  --card:#ffffff; --card-2:#FBF6EE;
  --ink:#2B2620; --ink-soft:#564E44;
  --muted:#92897B; --faint:#B6AC9C;
  --line:#ECE3D5; --line-soft:#F1EADF;
  --track:#EDE6D9;
  --good:#2FA46B; --warm:#E2774B; --cool:#2A6FDB; --alert:#E0556E;
  --shadow:0 1px 2px rgba(60,45,25,.04),0 12px 32px -12px rgba(80,60,30,.16);
  --shadow-sm:0 1px 2px rgba(60,45,25,.05),0 4px 14px -8px rgba(80,60,30,.18);
}
:root[data-theme="dark"]{
  --bg:#17140F; --bg-grad:#1C1813;
  --card:#221E18; --card-2:#272219;
  --ink:#F4EFE5; --ink-soft:#CFC6B6;
  --muted:#9B9080; --faint:#6E6557;
  --line:#332D24; --line-soft:#2B261E;
  --track:#2E281F;
  --good:#46C088; --warm:#F08B5C; --cool:#5C92F0; --alert:#F0708A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 6px 18px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(1200px 600px at 78% -8%, color-mix(in oklab, var(--accent) 9%, transparent), transparent 60%),
    linear-gradient(180deg,var(--bg-grad),var(--bg));
  background-attachment:fixed;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
h1,h2{margin:0;font-family:var(--font-display);}
.tnum{font-variant-numeric:tabular-nums;}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh;}
.main{flex:1;min-width:0;padding:30px 38px 64px;max-width:1320px;margin:0 auto;width:100%;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:250px;flex-shrink:0;padding:26px 18px;
  display:flex;flex-direction:column;gap:8px;
  border-right:1px solid var(--line);
  background:color-mix(in oklab,var(--card) 55%, transparent);
  backdrop-filter:blur(6px);
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 22px;}
.brand-mark{
  width:38px;height:38px;border-radius:calc(12px*var(--radius-scale));
  background:linear-gradient(135deg,var(--accent),color-mix(in oklab,var(--accent) 60%, #E8835A));
  color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;
  box-shadow:var(--shadow-sm);
}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em;}
.brand-name span{color:var(--accent);}
.nav{display:flex;flex-direction:column;gap:4px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-radius:var(--r-sm);font-size:15px;font-weight:600;color:var(--ink-soft);
  text-align:left;transition:background .15s,color .15s,transform .1s;
}
.nav-item:hover{background:var(--card-2);color:var(--ink);}
.nav-item.is-active{background:color-mix(in oklab,var(--accent) 14%, transparent);color:var(--accent);}
.nav-emoji{font-size:18px;width:22px;text-align:center;}
.sidebar-foot{margin-top:auto;}
.profile{display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--r-md);background:var(--card-2);}
.avatar{width:38px;height:38px;border-radius:var(--r-pill);background:linear-gradient(135deg,#E8835A,#E0A434);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;}
.profile-name{font-weight:700;font-size:14px;}
.profile-sub{font-size:12px;color:var(--muted);}

/* ---------- Header ---------- */
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:20px;flex-wrap:wrap;}
.header-eyebrow{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:4px;}
.header-title{font-size:32px;font-weight:800;letter-spacing:-.03em;}
.header-balance{text-align:right;display:flex;flex-direction:column;}
.header-balance-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.header-balance-val{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}

/* ---------- NL input (hero) ---------- */
.nl{margin-bottom:26px;}
.nl-bar{
  display:flex;align-items:center;gap:12px;padding:8px 8px 8px 20px;
  background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow);
  transition:border-color .2s,box-shadow .2s;
}
.nl-bar:focus-within{
  border-color:color-mix(in oklab,var(--accent) 55%, var(--line));
  box-shadow:var(--shadow),0 0 0 4px color-mix(in oklab,var(--accent) 16%, transparent);
}
.nl-bar.is-valid{border-color:color-mix(in oklab,var(--accent) 45%, var(--line));}
.nl-spark{font-size:20px;color:var(--accent);}
.nl-input{
  flex:1;border:none;outline:none;background:none;color:var(--ink);
  font-family:var(--font-body);font-size:17px;font-weight:500;padding:10px 0;min-width:0;
}
.nl-input::placeholder{color:var(--faint);font-weight:500;}
.nl-add{
  display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:calc(16px*var(--radius-scale));
  background:var(--accent);color:#fff;font-weight:700;font-size:15px;white-space:nowrap;
  transition:transform .12s,opacity .2s,filter .15s;
}
.nl-add:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px);}
.nl-add:disabled{opacity:.4;cursor:not-allowed;}
.nl-add kbd{background:rgba(255,255,255,.22);border-radius:6px;padding:1px 7px;font-size:13px;font-family:inherit;}
.nl-preview{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:14px;padding-left:6px;min-height:34px;
  animation:rowIn .22s ease;
}
@keyframes rowIn{from{transform:translateY(-5px);}to{transform:none;}}
.nl-hint{font-size:14px;color:var(--muted);}
.nl-chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-pill);
  font-size:14px;font-weight:700;background:color-mix(in oklab,var(--c) 16%, transparent);color:var(--c);
}
.nl-chip-emoji{font-size:15px;}
.nl-chip.ghost{background:var(--card-2);color:var(--ink-soft);border:1px solid var(--line);}
.nl-amt{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}
.nl-amt.expense{color:var(--warm);}
.nl-amt.income{color:var(--good);}
.nl-arrow{font-size:13px;color:var(--faint);font-style:italic;margin-left:2px;}
.nl-examples{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-left:6px;}
.nl-examples-label{font-size:13px;color:var(--muted);font-weight:600;}
.ex-chip{
  padding:7px 13px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line);
  font-size:13px;color:var(--ink-soft);font-weight:500;transition:border-color .15s,transform .1s,color .15s;
}
.ex-chip:hover{border-color:color-mix(in oklab,var(--accent) 45%, var(--line));color:var(--ink);transform:translateY(-1px);}
.nl-toast{
  margin-top:14px;display:inline-block;padding:9px 16px;border-radius:var(--r-pill);
  background:color-mix(in oklab,var(--good) 16%, var(--card));color:var(--good);font-weight:700;font-size:14px;
  border:1px solid color-mix(in oklab,var(--good) 30%, transparent);
  animation:pop .3s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96);}to{opacity:1;transform:none;}}

/* ---------- Layout ---------- */
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:22px;align-items:start;}
.col-main,.col-side{display:flex;flex-direction:column;gap:22px;min-width:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow-sm);}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;}
.card-eyebrow{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.card-title{font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;}
.count-pill{background:var(--card-2);color:var(--muted);font-size:13px;padding:2px 10px;border-radius:var(--r-pill);font-weight:700;}

/* ---------- Balance card ---------- */
.big-balance{font-size:38px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.range-toggle{display:flex;gap:4px;background:var(--card-2);padding:4px;border-radius:var(--r-pill);}
.range-toggle button{padding:7px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:700;color:var(--muted);transition:.15s;}
.range-toggle button.is-active{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm);}
.chart-area{position:relative;width:100%;height:240px;}
.balance-chart{width:100%;height:100%;display:block;overflow:visible;}
.chart-axis-label{fill:var(--faint);font-size:11px;font-family:var(--font-body);font-weight:600;}
.chart-hover-line{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 4;}

/* ---------- Stat cards ---------- */
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow-sm);}
.stat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.stat-label{font-size:12.5px;color:var(--muted);font-weight:600;}
.stat-icon{width:26px;height:26px;border-radius:var(--r-pill);display:grid;place-items:center;font-size:14px;font-weight:800;background:var(--card-2);color:var(--muted);}
.stat-value{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.stat-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.tone-good .stat-icon{background:color-mix(in oklab,var(--good) 16%,transparent);color:var(--good);}
.tone-warm .stat-icon{background:color-mix(in oklab,var(--warm) 16%,transparent);color:var(--warm);}
.tone-cool .stat-icon{background:color-mix(in oklab,var(--cool) 16%,transparent);color:var(--cool);}

/* ---------- Donut ---------- */
.donut-section{display:flex;flex-direction:column;align-items:center;gap:22px;}
.donut-wrap{position:relative;display:grid;place-items:center;}
.donut{transform:rotate(0deg);}
.donut circle{cursor:pointer;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;gap:3px;padding:0 12px;}
.donut-center-label{font-size:12.5px;color:var(--muted);font-weight:700;max-width:140px;line-height:1.25;}
.donut-center-val{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;}
.donut-center-pct{font-size:13px;color:var(--accent);font-weight:800;}
.legend{width:100%;display:flex;flex-direction:column;gap:11px;}
.legend-row{display:flex;align-items:center;gap:10px;font-size:14px;}
.legend-dot{width:11px;height:11px;border-radius:4px;flex-shrink:0;}
.legend-label{color:var(--ink-soft);font-weight:600;}
.legend-val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;}

/* ---------- Transactions ---------- */
.tx-list{display:flex;flex-direction:column;gap:10px;}
.tx-row{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--card);border:1.5px solid var(--line-soft);border-radius:var(--r-md);transition:all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);}
.tx-row.editable{cursor:pointer;}
.tx-row:hover{background:var(--card);border-color:color-mix(in oklab,var(--accent) 30%,var(--line));box-shadow:var(--shadow-sm);transform:translateY(-2px);}
.tx-icon{width:42px;height:42px;border-radius:calc(13px*var(--radius-scale));display:grid;place-items:center;font-size:19px;flex-shrink:0;}
.tx-main{flex:1;min-width:0;}
.tx-label{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-meta{font-size:13px;color:var(--muted);margin-top:2px;}
.tx-amt{font-weight:800;font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tx-amt.expense{color:var(--ink);}
.tx-amt.income{color:var(--good);}
.tx-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.tx-edit,.tx-del{width:32px;height:32px;border-radius:calc(8px*var(--radius-scale));color:var(--muted);font-size:14px;line-height:1;opacity:0.85;transition:all 0.2s ease;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--card-2);}
.tx-edit{color:var(--accent);}
.tx-del{color:var(--alert);font-size:17px;}
.tx-row:hover .tx-edit,.tx-row:hover .tx-del,.cat-manage-row:hover .tx-edit,.cat-manage-row:hover .tx-del{opacity:1;border-color:var(--line);}
.tx-edit:hover{background:var(--accent);color:#fff;border-color:var(--accent) !important;transform:scale(1.06);opacity:1;}
.tx-del:hover{background:var(--alert);color:#fff;border-color:var(--alert) !important;transform:scale(1.06);opacity:1;}
.empty{padding:32px;text-align:center;color:var(--muted);font-size:15px;}

/* ---------- Insights ---------- */
.insights-list,.insights-grid{display:flex;flex-direction:column;gap:12px;}
.insights-grid{display:grid;grid-template-columns:1fr 1fr;}
.insight-card{display:flex;gap:14px;padding:16px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line-soft);}
.insight-emoji{font-size:22px;width:42px;height:42px;border-radius:calc(13px*var(--radius-scale));display:grid;place-items:center;background:var(--card);flex-shrink:0;box-shadow:var(--shadow-sm);}
.insight-title{font-weight:700;font-size:15px;margin-bottom:3px;letter-spacing:-.01em;}
.insight-body{font-size:13.5px;color:var(--muted);line-height:1.5;text-wrap:pretty;}
.tone-good .insight-emoji{background:color-mix(in oklab,var(--good) 16%,var(--card));}
.tone-warm .insight-emoji{background:color-mix(in oklab,var(--warm) 16%,var(--card));}
.tone-alert .insight-emoji{background:color-mix(in oklab,var(--alert) 16%,var(--card));}
.tone-cool .insight-emoji{background:color-mix(in oklab,var(--cool) 16%,var(--card));}

/* ---------- Seg control ---------- */
.seg{display:flex;gap:4px;background:var(--card-2);padding:4px;border-radius:var(--r-pill);}
.seg button{padding:8px 16px;border-radius:var(--r-pill);font-size:13.5px;font-weight:700;color:var(--muted);transition:.15s;}
.seg button.is-active{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm);}

/* ---------- Category bars ---------- */
.cat-bars{display:flex;flex-direction:column;gap:18px;}
.cat-bar-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.cat-bar-name{font-weight:700;font-size:15px;}
.cat-bar-val{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;}
.cat-bar-val em{color:var(--muted);font-style:normal;font-weight:600;font-size:13px;}
.cat-bar-track{height:13px;border-radius:var(--r-pill);background:var(--track);overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:var(--r-pill);transition:width .5s cubic-bezier(.2,.8,.2,1);}

/* ---------- Summary ---------- */
.summary{display:flex;flex-direction:column;}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px;}
.summary-row:last-child{border-bottom:none;}
.summary-row span{color:var(--muted);}
.summary-row strong{font-weight:700;font-variant-numeric:tabular-nums;}

/* ---------- Buttons & tools ---------- */
.header-right{display:flex;align-items:center;gap:18px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:calc(14px*var(--radius-scale));font-weight:700;font-size:14.5px;transition:transform .12s,filter .15s,background .15s,border-color .15s;white-space:nowrap;}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-sm{padding:8px 14px;font-size:13.5px;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover:not(:disabled){filter:brightness(1.06);}
.btn-premium{background:linear-gradient(135deg,var(--accent),color-mix(in oklab,var(--accent) 75%,#E8835A));color:#fff;box-shadow:0 4px 15px rgba(42,111,219,0.25);position:relative;overflow:hidden;transition:all 0.25s cubic-bezier(0.2,0.8,0.2,1);}
.btn-premium:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(42,111,219,0.35);filter:brightness(1.08);}
.btn-premium:active{transform:translateY(0);}
.btn-premium::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transition:all 0.6s ease;}
.btn-premium:hover::after{left:100%;}
.btn-ghost{background:var(--card-2);color:var(--ink-soft);border:1px solid var(--line);}
.btn-ghost:hover{color:var(--ink);border-color:color-mix(in oklab,var(--accent) 35%,var(--line));}
.btn-danger-ghost{background:transparent;color:var(--alert);border:1px solid color-mix(in oklab,var(--alert) 35%,transparent);}
.btn-danger-ghost:hover{background:color-mix(in oklab,var(--alert) 12%,transparent);}
.head-tools{display:flex;align-items:center;gap:12px;}
.toggle-stack{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.seg.sm button{padding:7px 13px;font-size:13px;}

/* ---------- Cashflow chart ---------- */
.cashflow-wrap{position:relative;width:100%;height:100%;}
.cashflow-chart{width:100%;height:100%;display:block;}
.chart-baseline{stroke:var(--line);stroke-width:1.5;}
.cf-legend{display:flex;gap:18px;margin-bottom:10px;}
.cf-legend-item{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-soft);}
.cf-dot{width:11px;height:11px;border-radius:4px;}
.cf-dot.good{background:var(--good);}
.cf-dot.warm{background:var(--warm);}
.cf-tip{position:absolute;top:6px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:10px 12px;pointer-events:none;white-space:nowrap;z-index:3;}
.cf-tip-label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px;}
.cf-tip-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);}
.cf-tip-row strong{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:14px;}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:50;background:color-mix(in oklab,#1a1410 55%,transparent);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{width:min(460px,100%);max-height:90vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 24px 64px -16px rgba(40,25,10,.4);animation:modalIn .2s cubic-bezier(.2,.8,.2,1);}
@keyframes modalIn{from{transform:translateY(12px) scale(.98);}to{transform:none;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 14px;}
.modal-title{font-size:19px;font-weight:800;letter-spacing:-.02em;}
.modal-close{width:34px;height:34px;border-radius:var(--r-pill);font-size:22px;color:var(--muted);display:grid;place-items:center;transition:.15s;}
.modal-close:hover{background:var(--card-2);color:var(--ink);}
.modal-body{padding:4px 24px 8px;display:flex;flex-direction:column;gap:18px;}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 24px 22px;}
.foot-right{display:flex;gap:10px;margin-left:auto;}

/* ---------- Form fields ---------- */
.field{display:flex;flex-direction:column;gap:9px;}
.field-label{font-size:13px;font-weight:700;color:var(--ink-soft);}
.input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card-2);color:var(--ink);font-family:var(--font-body);font-size:15px;font-weight:600;transition:border-color .15s,box-shadow .15s;}
.input:focus{outline:none;border-color:color-mix(in oklab,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 15%,transparent);}
.amount-input{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card-2);transition:border-color .15s,box-shadow .15s;}
.amount-input:focus-within{border-color:color-mix(in oklab,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 15%,transparent);}
.amount-prefix{color:var(--muted);font-weight:800;font-size:16px;}
.amount-input .input{border:none;background:none;padding:13px 0;box-shadow:none;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.amount-input .input:focus{box-shadow:none;}
.type-toggle{display:flex;gap:8px;}
.type-toggle button{flex:1;padding:11px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card-2);font-weight:700;font-size:14px;color:var(--muted);transition:.15s;}
.type-toggle button.is-active.expense{border-color:var(--warm);background:color-mix(in oklab,var(--warm) 12%,transparent);color:var(--warm);}
.type-toggle button.is-active.income{border-color:var(--good);background:color-mix(in oklab,var(--good) 12%,transparent);color:var(--good);}
.cat-pick{display:flex;flex-wrap:wrap;gap:8px;}
.cat-pick-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--card-2);font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:.15s;}
.cat-pick-chip.is-active{border-color:var(--c);background:color-mix(in oklab,var(--c) 14%,transparent);color:var(--c);}
.emoji-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
.emoji-cell{aspect-ratio:1;border-radius:var(--r-sm);background:var(--card-2);border:1.5px solid transparent;font-size:18px;display:grid;place-items:center;transition:.12s;}
.emoji-cell:hover{background:var(--line-soft);}
.emoji-cell.is-active{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,transparent);}
.color-grid{display:flex;flex-wrap:wrap;gap:9px;}
.color-cell{width:32px;height:32px;border-radius:var(--r-pill);border:2px solid transparent;box-shadow:0 0 0 1.5px var(--line) inset;transition:.12s;}
.color-cell.is-active{border-color:var(--card);box-shadow:0 0 0 2px var(--ink);transform:scale(1.08);}
.cat-preview{display:flex;align-items:center;gap:13px;padding:14px;border-radius:var(--r-md);background:var(--card-2);}
.cat-preview-icon{width:46px;height:46px;border-radius:calc(14px*var(--radius-scale));display:grid;place-items:center;font-size:22px;}
.cat-preview-name{font-weight:800;font-size:17px;letter-spacing:-.01em;}

/* ---------- Category manager ---------- */
.cat-manage-list{display:flex;flex-direction:column;}
.cat-manage-row{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line-soft);}
.cat-manage-row:last-child{border-bottom:none;}
.cat-manage-icon{width:40px;height:40px;border-radius:calc(12px*var(--radius-scale));display:grid;place-items:center;font-size:18px;flex-shrink:0;}
.cat-manage-main{flex:1;min-width:0;}
.cat-manage-name{font-weight:700;font-size:15px;}
.cat-manage-meta{font-size:12.5px;color:var(--muted);margin-top:2px;}

/* ---------- Responsive ---------- */
@media(max-width:1080px){
  .grid-2{grid-template-columns:1fr;}
  .insights-grid{grid-template-columns:1fr;}
}
@media(max-width:760px){
  .sidebar{display:none;}
  .main{padding:22px 18px 56px;}
  .mini-stats{grid-template-columns:1fr;}
  .header-right{flex-direction:column;align-items:flex-end;gap:10px;}
  .emoji-grid{grid-template-columns:repeat(8,1fr);}
}
</style>
</head>
